services:
  drawio:
    build:
      context: .
      dockerfile: drawio/Dockerfile
    image: ${DRAWIO_IMAGE:-drawio-arquitetura:latest}
    container_name: drawio-arquitetura
    restart: unless-stopped
    ports:
      - "${DRAWIO_PORT:-9293}:8080"
    environment:
      DRAWIO_LANG: pt-br
    # Edite plugins e bibliotecas sem rebuild: basta `docker compose restart`.
    # Para usar só o que está dentro da imagem, remova os volumes.
    volumes:
      - ./plugins:/opt/drawio-custom/plugins:ro
      - ./drawio/libraries:/opt/drawio-custom/libraries:ro
      - ./drawio/config.json:/opt/drawio-custom/config.json:ro
